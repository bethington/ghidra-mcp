# Tool-output regression baseline for Benchmark.dll.
# Schema: fun-doc/benchmark/regression/__schema__.md
# Runner: tools.setup.ghidra.run_benchmark_regression
#
# Every assertion that fails fails the regression. Use `skipped:` for known
# coverage gaps and add a reason. Auto-analyzer drift is tolerated by using
# *_min fields (>=) rather than exact matches.

program:
  name: "Benchmark.dll"
  path: "/testing/benchmark/Benchmark.dll"
  architecture: "x86"
  language: "x86:LE:32:default"
  compiler: "windows"
  # Counts assume /run_analysis has been called on the imported binary.
  # The runner does this in _bench_ensure_full_analysis before assertions.
  # Retargeted 2026-08-10 for the vs2003 build. The 2026-08-08 rebuild switched
  # the fixture from --toolchain vc6sp6 (VC6 cl + VS2003 link) to --toolchain
  # vs2003 (cl 13.10.3077 + link 7.10) -- see build/build_manifest.json, which
  # is the authority for what actually produced the binary in build/. That is
  # the toolchain D2 1.13c was really built with, so the change was deliberate
  # and this baseline was simply never updated to follow it.
  #
  # Both toolchains link at /BASE:0x6FD50000 and report linker 7.10, so the PE
  # header alone CANNOT tell them apart -- read build_manifest.json, not the
  # headers, when these assertions next drift.
  function_count_min: 140              # observed 184 via /get_function_count
  symbol_count_min: 700                # observed 805 post-analysis
  string_count_min: 50                 # observed 108
  segments:
    - name: "Headers"
    - name: ".text"
    - name: ".rdata"
    - name: ".data"

# User-authored functions in src/*.c. CRT-runtime helpers are intentionally not
# asserted — they vary across compilers/versions.
#
# ADDRESSES ARE BUILD OBSERVATIONS, NOT SOURCE FACTS. Both vc6sp6 and vs2003
# link at /BASE:0x6FD50000 (matching D2Common.dll), so a toolchain switch keeps
# the base but moves every function: the 2026-08-08 vs2003 rebuild shifted
# compute_gcd from +0x50 to +0xc0 and entry from +0x2a9 to +0x3ae, with the
# sources untouched since April. Re-derive from build/Benchmark.map (or
# /list_functions) after ANY rebuild; never assume a fixed delta.
#
# The structural counts are observations too. vs2003 /O2 emits markedly more
# code than VC6 /O2 for the same C: calc_crc16 is 66 instructions / 29 basic
# blocks here against 26 / 10 under vc6sp6. A change in these numbers means the
# binary changed -- confirm against build_manifest.json before re-baselining,
# because that is exactly the signal this file exists to raise.
functions:
  - address: "0x6fd51000"
    name: "calc_crc16"
    # return_type_contains dropped: VC6's signature recovers as
    # `undefined calc_crc16(int, uint)`, so the old "ushort" assertion cannot
    # hold. The C source still returns unsigned short — this is a decompiler
    # recovery difference, not a behaviour change.
    param_count: 2
    basic_block_count: 29
    cyclomatic_complexity: 11
    instruction_count_min: 20                  # observed 66 under vs2003
    xref_count_to_min: 3                       # observed 4
    is_thunk: false
    decompile_must_be_nonempty: true
    decompile_contains: ["0x1021", "0xffff"]
    immediate_values_contains: [4129, 65535]   # 0x1021, 0xFFFF — CRC-16/CCITT signatures

  - address: "0x6fd510c0"
    name: "compute_gcd"
    param_count: 2
    is_thunk: false
    decompile_must_be_nonempty: true
    decompile_contains: ["%"]                  # Euclidean modulo

  - address: "0x6fd510e0"
    name: "get_stat_list_flags"
    param_count: 1
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd51100"
    name: "get_stat_list_layer"
    param_count: 1
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd51110"
    name: "get_stat_list_owner_guid"
    param_count: 1
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd51130"
    name: "get_stat_list_prev_link"
    param_count: 1
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd51150"
    name: "stat_list_add"
    param_count: 4                              # captures the four-arg add-with-flags variant
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd511a0"
    name: "advance_parser_state"
    param_count: 2
    basic_block_count: 18                       # switch ladder — the densest of the five
    is_thunk: false
    decompile_must_be_nonempty: true

  - address: "0x6fd51210"
    name: "compute_str_len"
    param_count: 1
    is_thunk: false
    decompile_must_be_nonempty: true
    decompile_contains: ["while", "!="]        # null-terminator scan

  # Replaces the old dllmain_crt_dispatch entry: that Ghidra-canonical helper
  # name does not exist in the VC6 CRT, whose only recognised startup function
  # is the raw entry point.
  - address: "0x6fd513ae"
    name: "entry"
    is_thunk: false
    decompile_must_be_nonempty: true

# Endpoint connectivity + structural checks for categories without a clear
# per-function or per-data home. One assertion per category at minimum.
endpoint_smoke:
  # listing
  - endpoint: "/get_function_count"
    assert:
      type: "json"
      contains_keys: ["function_count", "program"]

  - endpoint: "/list_segments"
    assert:
      type: "lines"
      min_lines: 4
      contains: [".text", ".rdata", ".data"]

  - endpoint: "/list_strings"
    assert:
      type: "lines"
      min_lines: 50

  - endpoint: "/list_imports"
    assert:
      type: "nonempty"

  - endpoint: "/list_exports"
    assert:
      type: "lines"
      contains: ["calc_crc16", "compute_gcd", "entry"]

  - endpoint: "/list_namespaces"
    assert:
      type: "lines"
      min_lines: 1

  - endpoint: "/list_data_items"
    assert:
      type: "nonempty"

  - endpoint: "/list_data_types"
    assert:
      type: "lines"
      min_lines: 10

  - endpoint: "/list_data_type_categories"
    assert:
      type: "nonempty"

  - endpoint: "/list_calling_conventions"
    assert:
      type: "lines"
      # 4 conventions for x86:LE:32:default. The old text form carried an
      # "Available Calling Conventions (N):" header plus a blank line, so the
      # pre-7.0.0 line count was inflated by 2.
      min_lines: 4
      contains: ["__cdecl", "__stdcall", "__fastcall"]

  - endpoint: "/list_classes"
    assert:
      type: "nonempty"

  - endpoint: "/list_methods"
    assert:
      type: "nonempty"

  - endpoint: "/list_external_locations"
    assert:
      type: "nonempty"

  # getter
  - endpoint: "/get_metadata"
    assert:
      type: "text"
      contains: ["\"architecture\": \"x86\"", "function_count", "\"compiler\": \"windows\""]

  - endpoint: "/get_address_spaces"
    assert:
      type: "nonempty"

  - endpoint: "/get_entry_points"
    assert:
      type: "nonempty"

  - endpoint: "/get_current_program_info"
    assert:
      type: "json"
      contains_keys: ["name"]

  # decompile (per-function covers most); bulk form absorbed batch_decompile in 7.0.0
  - endpoint: "/decompile_function"
    params: { functions: "0x6fd51000,0x6fd51050" }
    assert:
      type: "nonempty"

  # search
  - endpoint: "/search_functions"
    params: { name_pattern: "compute" }
    assert:
      type: "lines"
      contains: ["compute_gcd", "compute_str_len"]

  - endpoint: "/search_strings"
    params: { search_term: "stdcall" }
    assert:
      type: "nonempty"

  # The param is `pattern`, not `query`. Before 7.0.0 the wrong name produced a
  # plain-text "Search pattern is required", which satisfied `nonempty` -- so
  # this case passed while testing nothing. Converting errors to {"error": ...}
  # in stage 5 surfaced it.
  - endpoint: "/search_data_types"
    params: { pattern: "int" }
    assert:
      type: "nonempty"

  # xref
  - endpoint: "/get_xrefs_to"
    params: { address: "0x6fd51000" }
    assert:
      type: "lines"
      min_lines: 1

  - endpoint: "/get_xrefs_from"
    params: { address: "0x6fd51130" }
    assert:
      type: "nonempty"

  # analysis
  - endpoint: "/list_analyzers"
    assert:
      type: "nonempty"

  - endpoint: "/analysis_status"
    assert:
      type: "json"
      contains_keys: ["analyzed", "analyzing"]

  # function
  # entry, not advance_parser_state: under VC6 the parser has ZERO callees, so
  # the old target would satisfy nothing while appearing to pass a `nonempty`.
  - endpoint: "/get_function_callees"
    params: { address: "0x6fd512a9" }
    assert:
      type: "nonempty"

  # script
  - endpoint: "/list_scripts"
    assert:
      type: "nonempty"

  # system / utility
  - endpoint: "/check_connection"
    assert:
      type: "text"
      contains: ["GhidraMCP plugin running"]

  - endpoint: "/list_open_programs"
    assert:
      type: "json"
      contains_keys: ["programs"]

# Explicit skips. Each entry must include `endpoint` and `reason`. The runner
# logs these at the end of the regression so they're visible in CI output.
skipped:
  - endpoint: "/find_dead_code"
    reason: "Per-function endpoint; no clean per-binary smoke variant"
  - endpoint: "/check_tools"
    reason: "Bridge-side static tool, not an HTTP endpoint"
  - endpoint: "/bsim_query_function_match"
    reason: "BSim DB empty in dev environment"
  - endpoint: "/debugger_set_breakpoint_2"
    reason: "Duplicate-class endpoint; covered by /debugger_set_breakpoint in run_debugger_live_test"
  - endpoint: "/debugger_status_2"
    reason: "Duplicate-class endpoint; covered by /debugger_status"
  - endpoint: "/import_data_types"
    reason: "Mutating endpoint; would corrupt baseline state for subsequent assertions"
  - endpoint: "/import_file"
    reason: "Already exercised by reset_benchmark_fixture"
  - endpoint: "/run_ghidra_script"
    reason: "Requires GHIDRA_MCP_ALLOW_SCRIPTS=1 and a script file; out of scope for read-only baseline"
  - endpoint: "/run_script_inline"
    reason: "Requires GHIDRA_MCP_ALLOW_SCRIPTS=1 and inline script; out of scope for read-only baseline"
  - endpoint: "/emulate_function"
    reason: "Emulation needs careful seed state; covered by dedicated emulation tests"
  - endpoint: "/emulate_hash_batch"
    reason: "Emulation needs careful seed state; covered by dedicated emulation tests"
  - endpoint: "/save_program"
    reason: "Persists changes; would dirty the baseline for subsequent runs"
  - endpoint: "/exit_ghidra"
    reason: "Terminates Ghidra; obviously cannot run during a regression"
  - endpoint: "/reanalyze"
    reason: "Mutating; covered by reset_benchmark_fixture's auto_analyze=true"
