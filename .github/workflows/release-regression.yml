name: Release Regression

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      ghidra_path:
        description: "Path to the Ghidra install on the self-hosted runner"
        required: true
        default: "F:\\ghidra_12.1.2_PUBLIC"
      test_tier:
        description: "Deploy regression tier to run"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - selected-contract
          - benchmark-read
          - benchmark-write
          - multi-program
          - negative-contract
          - endpoint-catalog
  workflow_call:
    inputs:
      ghidra_path:
        description: "Path to the Ghidra install on the self-hosted runner"
        required: true
        type: string
      test_tier:
        description: "Deploy regression tier to run"
        required: false
        type: string
        default: "release"

# OSSF Scorecard Token-Permissions: default to read-only. The
# regression runner reads the checked-out tree and uploads test
# artifacts (via actions/upload-artifact, which does NOT need
# repo-write — it uses its own scoped token).
permissions:
  contents: read

jobs:
  live-ghidra-regression:
    name: Live Ghidra Release Regression
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'live-ghidra-regression')
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      GHIDRA_REGRESSION_PATH: ${{ inputs.ghidra_path || vars.GHIDRA_PATH || 'F:\ghidra_12.1.2_PUBLIC' }}
      GHIDRA_REGRESSION_TIER: ${{ inputs.test_tier || 'release' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        shell: powershell
        run: |
          uv python install 3.13
          uv sync --python 3.13 --group test

      # A "Build Benchmark.dll" step used to run here:
      #     uv run python fun-doc\benchmark\build.py
      # `fun-doc/` (and its benchmark fixture) moved to the d2-game-exe
      # repository on 2026-08-10 (commit 10960f76), so that path has not
      # existed in this tree since. The step could only ever fail.
      #
      # Removing it does NOT make the benchmark-backed tiers work — see the
      # guard below. The fixture itself is gone, not just its build script.
      - name: Check the requested tier can run in this repository
        shell: powershell
        run: |
          # tools/setup/ghidra.py resets the Benchmark.dll fixture for these
          # tiers (BENCHMARK_DEPLOY_TEST_MODES plus the negative-contract
          # branch of run_deploy_tests). The fixture lives in d2-game-exe now,
          # so reset_benchmark_fixture() raises before any assertion runs.
          # Fail here instead: this costs seconds rather than failing after a
          # full build, Ghidra restart and deploy.
          $tier = "$env:GHIDRA_REGRESSION_TIER"
          $needsBenchmark = @(
            'release', 'benchmark-read', 'benchmark-write',
            'multi-program', 'debugger-live', 'negative-contract'
          )
          if ($needsBenchmark -contains $tier) {
            Write-Host "::error::Tier '$tier' needs the Benchmark.dll fixture, which moved to the d2-game-exe repository with fun-doc on 2026-08-10. It cannot run here."
            Write-Host "Tiers that still run from this repository: endpoint-catalog, selected-contract."
            Write-Host "Deciding what the release gate should be instead is a maintainer call - see docs/releases/RELEASE_CHECKLIST.md."
            exit 1
          }
          Write-Host "Tier '$tier' does not need the benchmark fixture; continuing."

      - name: Install Ghidra jars
        shell: powershell
        run: uv run python -m tools.setup install-ghidra-deps --ghidra-path "$env:GHIDRA_REGRESSION_PATH"

      - name: Build extension
        shell: powershell
        run: uv run python -m tools.setup build

      - name: Deploy and run release regression
        shell: powershell
        run: uv run python -m tools.setup deploy --ghidra-path "$env:GHIDRA_REGRESSION_PATH" --test "$env:GHIDRA_REGRESSION_TIER"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-regression-artifacts
          path: |
            tests/junit.xml
            target/*.zip
            deploy-debug.log
          if-no-files-found: ignore
