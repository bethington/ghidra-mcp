# Curated read-tier assertions, batch 2: listing, symbols, comments, analysis.
#
# Same principle as read_assertions.yaml -- assert meaning against known facts
# about Benchmark.dll, not whatever the server said when a snapshot was taken.
#
# These lean on structural facts (envelope keys, known function names, filters
# actually filtering) rather than exact counts, which drift as the analyzer
# improves and would make the suite noisy for no gain.

defaults:
  args:
    program: "Benchmark.dll"
  timeout: 60

tool_cases:

  # ---- listing envelopes ---------------------------------------------------
  - tool: list_functions
    name: curated
    tier: read
    snapshot: false
    args: {}
    assert:
      json_keys: ["functions", "count"]
      contains: ["calc_crc16", "compute_gcd"]

  - tool: list_program_items
    name: curated_methods
    tier: read
    snapshot: false
    args: { kind: methods, limit: 500 }
    assert:
      json_keys: ["kind", "items", "count", "offset", "total"]
      json_equals: { kind: "methods" }
      contains: ["calc_crc16"]

  - tool: list_program_items
    name: curated_imports
    tier: read
    snapshot: false
    args: { kind: imports, limit: 50 }
    assert:
      json_keys: ["kind", "items", "count", "offset", "total"]
      json_equals: { kind: "imports" }

  - tool: list_strings
    name: curated
    tier: read
    snapshot: false
    args: { limit: 50 }
    assert:
      json_keys: ["strings", "count", "offset", "total"]

  - tool: list_program_items
    name: curated_data_items
    tier: read
    snapshot: false
    args: { kind: data_items, limit: 20 }
    assert:
      json_keys: ["kind", "items", "count", "offset", "total"]
      json_equals: { kind: "data_items" }

  # `category` is a filter and is now optional (it was required, so listing
  # every data type was impossible). Omitting it here is the regression test.
  - tool: find_data_types
    name: curated_no_filter
    tier: read
    snapshot: false
    args: { limit: 20 }
    assert:
      json_keys: ["data_types", "count", "offset", "total"]

  - tool: list_calling_conventions
    name: curated
    tier: read
    snapshot: false
    args: {}
    assert:
      json_keys: ["calling_conventions", "count"]
      contains: ["__cdecl", "__stdcall", "__fastcall"]

  # Paging must be real: a limit of 1 returns 1 item but reports the full total.
  # That distinction is the entire reason the envelope carries `total`, and a
  # port that returned count == total would look fine to a snapshot.
  - tool: list_program_items
    name: curated_paging_total_vs_count
    tier: read
    snapshot: false
    args: { kind: methods, limit: 1, offset: 0 }
    assert:
      json_equals: { kind: "methods", count: 1, offset: 0 }
      not_contains: ['"total": 1']

  # ---- function detail -----------------------------------------------------
  # `limit` here was declared String while 36 sibling tools declared int, so
  # passing a number failed on this tool alone. Pinned at the protocol level.
  - tool: get_functions
    name: curated_limit_is_numeric
    tier: read
    snapshot: false
    args: { address: "0x10001000", limit: 10 }
    assert:
      no_error: true
      not_contains: ["validation error", "should be a valid string"]

  - tool: get_functions
    name: curated_callees
    tier: read
    snapshot: false
    args:
      name: "advance_parser_state"
      fields: callees
      include_call_context: false
    assert:
      json_keys: ["callees", "callee_count"]

  - tool: get_functions
    name: curated_callers
    tier: read
    snapshot: false
    args:
      name: "calc_crc16"
      fields: callers
      include_call_context: false
    assert:
      json_keys: ["callers", "caller_count"]

  - tool: get_functions
    name: curated_labels
    tier: read
    snapshot: false
    args:
      name: "0x10001000"
      fields: labels
      include_call_context: false
    assert:
      json_keys: ["labels"]

  - tool: get_xrefs_from
    name: curated
    tier: read
    snapshot: false
    args: { address: "0x10001210" }
    assert:
      json_keys: ["references", "count", "total"]

  # get_comment now emits all five kinds on every response: null for a kind
  # that was never set, "" for one explicitly cleared. calc_crc16's plate/pre
  # are Ghidra's own auto-generated demangling comments; eol/post/repeatable
  # have never been touched on this fixture, so they must come back as
  # literal null rather than being omitted.
  - tool: get_comment
    name: curated_kinds_and_convenience_fields
    tier: read
    snapshot: false
    args: { address: "0x10001000" }
    assert:
      json_keys: ["address", "plate", "pre", "eol", "post", "repeatable", "comment", "has_comment"]
      contains: ['"eol":null', '"post":null', '"repeatable":null']
      no_error: true

  # ---- analysis ------------------------------------------------------------
  - tool: analyze_function_completeness
    name: curated_single_compact
    tier: read
    snapshot: false
    args: { function_address: "0x10001000", compact: true }
    assert:
      json_keys: ["function_name", "effective_score", "completeness_score"]
      json_equals: { function_name: "calc_crc16" }

  - tool: get_language_metadata
    name: curated
    tier: read
    snapshot: false
    args: {}
    assert:
      no_error: true
      contains: ["x86"]

  - tool: get_address_spaces
    name: curated
    tier: read
    snapshot: false
    args: {}
    assert:
      json_keys: ["address_spaces", "count"]

  # ---- error shape on a missing required argument -------------------------
  - tool: get_functions
    name: curated_missing_target
    tier: read
    snapshot: false
    args:
      fields: callees
      include_call_context: false
    assert:
      error_contains: ["error"]
