# Debugger conformance corpus (Phase 2 fixture).
#
# Drives Ghidra's live TraceRmi debugger surface through actual MCP calls --
# tools/list + tools/call -- not the raw HTTP harness in
# tools/setup/ghidra.py's run_debugger_live_test, which proves the backend
# works but exercises the plugin's HTTP routes directly, not the MCP
# protocol layer this suite exists to cover.
#
# Opt-in tier: launching a live debug session takes real time and needs a
# working dbgeng/WDK backend, so `--tier debugger` must be requested
# explicitly. It is never included in the default combined run (see
# run_conformance.py's tier filter, same treatment as `destructive`).
#
# Scope: all 18 debugger_* tools, including the 5 that need a dynamic
# (post-ASLR) runtime address -- set_breakpoint, remove_breakpoint,
# read_memory, static_to_dynamic, dynamic_to_static. Confirmed live:
# BenchmarkDebug.exe's static image base 0x00400000 loads at a randomized
# runtime base (observed 0x00c20000, will differ next launch), so no
# hardcoded address works for these five. The runner supports response
# chaining for exactly this: a case can `extract: {name: "json.path"}` a
# value from its own response, and a later case's arg can reference it as
# the literal string "${name}", substituted at call time (see
# ConformanceRunner._substitute_args in runner.py). Here, debugger_
# registers_2 extracts the live RIP as `runtime_pc`; every dynamic-address
# case below consumes "${runtime_pc}" instead of a hardcoded address, and
# they're placed immediately after the register read so no intervening
# step/resume call has moved RIP out from under them.
#
# Sequencing matters here, unusually: cases run in file order (top to
# bottom), and later cases depend on earlier ones leaving a live session in
# place. debugger_launch must run first. debugger_resume must run last --
# BenchmarkDebug.exe is launched with `--seconds 180` and self-exits once
# running, and leaving it stopped instead is exactly how a stuck,
# taskkill-proof process was found earlier (see feedback_graceful_ghidra_
# lifecycle / project_mcp_response_contract memory).
#
# Tool names: several of these collide with a bridge-side static proxy tool
# of the same short name that forwards to the *separate* standalone
# debugger server (python -m debugger, port 8099) -- an entirely different
# subsystem from the in-process TraceRmi surface this corpus drives.
# EndpointsJsonParityTest's schema disambiguates the collision with a `_2`
# suffix on the in-process one: status_2, modules_2, registers_2,
# stack_trace_2, list_breakpoints_2, step_into_2, step_over_2, plus (added
# for the dynamic-address tools) set_breakpoint_2, remove_breakpoint_2,
# read_memory_2 -- the bridge-side proxies of the same bare names take a
# `ghidra_address` param and talk to the port-8099 server instead. Tools
# with no name collision (launch, traces, launch_offers, resume, interrupt,
# step_out, static_to_dynamic, dynamic_to_static) keep their plain name.
# Confirmed live: calling the plain name for a colliding tool returns
# {"error": "Debugger server not running at http://127.0.0.1:8099 ..."}
# even with a real TraceRmi session active -- that error is the signature
# of having picked the wrong one.
#
# python_executable is mandatory here, not cosmetic: the offer's default
# OPT_PYTHON_EXE is bare "python", which Ghidra's own process PATH resolves
# to the ghidra-mcp repo's own .venv -- a venv-launcher stub that re-execs
# the base interpreter but keeps that venv's (dependency-free) site-packages.
# ghidradbg's own import then hits Ghidra's built-in mitigation prompt
# (ghidratrace.setuputils.prompt_and_mitigate_dependencies), which blocks on
# input() forever since nothing feeds its stdin -- manifesting as a 90s
# "waiting for a Trace RMI connection" timeout with an orphaned
# `python -i local-dbgeng.py` process left behind, not as an import error.
# Confirmed root cause 2026-07-26 after ruling out concurrent-launch
# collisions with a genuinely clean single-shot test. Point this at a Python
# that actually has pybag/comtypes/ghidratrace installed (System Python here;
# also required Pybag >=2.2.13, since 2.2.12 has a real upstream bug against
# newer comtypes -- see project memory).

defaults:
  timeout: 60

tool_cases:
  - tool: debugger_launch
    name: live_launch
    tier: debugger
    snapshot: false
    timeout: 120
    args:
      executable_path: '{REPO_ROOT}\fun-doc\benchmark\build\BenchmarkDebug.exe'
      args: "--seconds 180"
      cwd: '{REPO_ROOT}\fun-doc\benchmark\build'
      timeout_seconds: 90
      program: "BenchmarkDebug.exe"
      offer: "BATCH_FILE:local-dbgeng.bat"
      python_executable: 'C:\Python313\python.exe'
    assert:
      no_error: true
      json_keys: ["status", "trace_name"]

  - tool: debugger_status_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true
      json_equals: { debugger_active: true, trace_active: true, target_connected: true }

  - tool: debugger_traces
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true
      contains: ["BenchmarkDebug"]

  - tool: debugger_modules_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true
      contains: ["BenchmarkDebug.exe"]

  - tool: debugger_registers_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true
      json_keys: ["RIP", "RSP", "RAX"]
    extract: { runtime_pc: "RIP" }

  # The 5 dynamic-address tools, unblocked by the extract/${} mechanism
  # above. The first 4 consume the RIP just captured, before any step/resume
  # call below has a chance to move it. static_to_dynamic uses a fixed
  # static address instead (not ${runtime_pc}, no ordering dependency on
  # this RIP capture) -- its own call now retries internally against
  # DebuggerStaticMappingService's settle window (MAPPING_SETTLE_TIMEOUT_MS
  # in DebuggerService.java), so it no longer needs to run later in the
  # sequence than these four.
  - tool: debugger_dynamic_to_static
    name: live
    tier: debugger
    snapshot: false
    args: { address: "${runtime_pc}" }
    assert:
      no_error: true
      json_keys: ["dynamic_address", "module", "offset"]

  - tool: debugger_static_to_dynamic
    name: live
    tier: debugger
    snapshot: false
    timeout: 30
    args: { address: "0x004016b6", program: "BenchmarkDebug.exe" }
    assert:
      no_error: true
      json_keys: ["static_address", "dynamic_address", "program"]

  - tool: debugger_set_breakpoint_2
    name: live
    tier: debugger
    snapshot: false
    args: { address: "${runtime_pc}" }
    assert:
      no_error: true

  - tool: debugger_read_memory_2
    name: live
    tier: debugger
    snapshot: false
    args: { address: "${runtime_pc}", size: 16 }
    assert:
      no_error: true
      nonempty: true

  # Removes the breakpoint set two cases up -- must happen before the final
  # resume, or the target would trap right back into itself instead of
  # running its --seconds 180 timer to completion.
  - tool: debugger_remove_breakpoint_2
    name: live
    tier: debugger
    snapshot: false
    args: { address: "${runtime_pc}" }
    assert:
      no_error: true

  - tool: debugger_stack_trace_2
    name: live
    tier: debugger
    snapshot: false
    args: { depth: 8 }
    assert:
      no_error: true
      nonempty: true

  - tool: debugger_list_breakpoints_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true

  - tool: debugger_launch_offers
    name: live
    tier: debugger
    snapshot: false
    args: { program: "BenchmarkDebug.exe" }
    assert:
      no_error: true
      contains: ["dbgeng"]

  - tool: debugger_step_into_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true

  - tool: debugger_step_over_2
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true

  - tool: debugger_step_out
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true

  # No assertion beyond MCP-level success/failure: whether interrupt errors
  # ("already stopped") or succeeds both indicate correct, expected
  # behavior depending on the exact execution state left by the steps
  # above, and this suite has no way to know which without an address-aware
  # step-by-step trace of its own.
  - tool: debugger_interrupt
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert: {}

  # Always last: leave the target running rather than stopped. Launched
  # with --seconds 180, it self-exits once running -- stopped is exactly
  # the state that left a taskkill-proof zombie process behind before.
  - tool: debugger_resume
    name: live
    tier: debugger
    snapshot: false
    args: {}
    assert:
      no_error: true
